name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check --config-path=stylua.toml .
  tests:
    strategy:
      fail-fast: false
      matrix:
        neovim: [v0.12.6, nightly]
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    needs: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Install test dependencies
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim /tmp/plenary.nvim
      - name: Run Tests
        env:
          PLENARY_PATH: /tmp/plenary.nvim
        run: |
          nvim --version
          nvim --headless -u tests/minimal_init.lua -c "PlenaryBustedDirectory tests/spec { minimal_init = 'tests/minimal_init.lua', sequential = true }"
  smoke:
    name: Full configuration smoke test
    needs: stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: v0.12.6
          neovim: true
      - name: Install plugins and start the full configuration
        env:
          GIT_TERMINAL_PROMPT: 0
          XDG_CONFIG_HOME: /tmp/nvim-smoke/config
          XDG_DATA_HOME: /tmp/nvim-smoke/data
          XDG_STATE_HOME: /tmp/nvim-smoke/state
          XDG_CACHE_HOME: /tmp/nvim-smoke/cache
        run: |
          mkdir -p "$XDG_CONFIG_HOME"
          ln -s "$GITHUB_WORKSPACE" "$XDG_CONFIG_HOME/nvim"
          timeout 300 nvim --headless "+Lazy! install" \
            "+lua local ok, err = pcall(function() assert(not require('lazy.manage.checker').has_errors(), 'plugin installation failed') end); if not ok then vim.api.nvim_err_writeln(err); vim.cmd('cquit') end" \
            "+qa"
          timeout 60 nvim --headless \
            "+lua local ok, err = pcall(function() assert(vim.fn.exists(':Lazy') == 2, 'lazy.nvim did not load'); assert(vim.g.mapleader == ' ', 'full configuration did not load') end); if not ok then vim.api.nvim_err_writeln(err); vim.cmd('cquit') end" \
            "+qa"
  docker-build:
    name: Docker runtime build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          tags: liubang/nvim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
  docs:
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - name: panvimdoc
        uses: kdheepak/panvimdoc@1f9433df889d4ab3daa5ea52c7069cb489ad47d6
        with:
          vimdoc: nvimrc
          version: "Neovim >= 0.12.0"
          demojify: true
          treesitter: true
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(build): auto-generate vimdoc"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
  release:
    name: release
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - docs
      - tests
      - smoke
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          package-name: nvimrc
      - uses: actions/checkout@v4
      - name: tag stable versions
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git remote add gh-token "https://${{ secrets.GITHUB_TOKEN }}@github.com/google-github-actions/release-please-action.git"
          git tag -d stable || true
          git push origin :stable || true
          git tag -a stable -m "Last Stable Release"
          git push origin stable
      - name: Set up QEMU
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: ${{ steps.release.outputs.release_created }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: liubang/nvim:latest,liubang/nvim:${{ steps.release.outputs.tag_name }}
